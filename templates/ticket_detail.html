<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DeskHive — Ticket</title>
</head>
<body>
    <a href="/tickets/">&larr; Back to tickets</a>
    <h1 id="ticketTitle">Loading...</h1>
    <p id="ticketDetails"></p>

    <button id="claimBtn">Claim this ticket</button>
    <p id="claimMessage"></p>

    <script>
        // Read the token we stored at login
        const token = localStorage.getItem("access");
        if (!token) {
            window.location.href = "/";
        }

        // Read the ticket ID from the URL.
        // URL looks like /tickets/6/  →  split by "/" gives ["", "tickets", "6", ""]
        // so the ID is the 3rd piece (index 2).
        const parts = window.location.pathname.split("/");
        const ticketId = parts[2];

        // Load and display the ticket's details
        async function loadTicket() {
            const response = await fetch("/api/tickets/" + ticketId + "/", {
                headers: { "Authorization": "Bearer " + token }
            });

            if (response.ok) {
                const ticket = await response.json();
                document.getElementById("ticketTitle").textContent =
                    "#" + ticket.id + " — " + ticket.title;
                document.getElementById("ticketDetails").textContent =
                    "Status: " + ticket.status +
                    " | Priority: " + ticket.priority +
                    " | Description: " + ticket.description;
            } else {
                document.getElementById("ticketTitle").textContent = "Could not load ticket.";
            }
        }

        loadTicket();

        // Handle the Claim button
        const claimBtn = document.getElementById("claimBtn");
        claimBtn.addEventListener("click", async function () {
            const claimMessage = document.getElementById("claimMessage");

            const response = await fetch("/api/tickets/" + ticketId + "/claim/", {
                method: "POST",
                headers: { "Authorization": "Bearer " + token }
            });

            const data = await response.json();

            if (response.ok) {
                claimMessage.textContent = "✅ " + data.detail + " (assigned to " + data.assigned_to + ")";
                loadTicket();  // reload to show the updated status
            } else {
                claimMessage.textContent = "⚠️ " + data.detail;
            }
        });
    </script>
</body>
</html>

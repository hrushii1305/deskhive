{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DeskHive — Ticket</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <a href="/tickets/">&larr; Back to tickets</a>
    <button id="logoutBtn">Log out</button>
    <h1 id="ticketTitle">Loading...</h1>
    <p id="ticketDetails"></p>

    <button id="claimBtn">Claim this ticket</button>
    <p id="claimMessage"></p>

    <h2>Comments</h2>
    <ul id="commentList"></ul>

    <textarea id="commentBody" placeholder="Write a comment..." rows="3" cols="40"></textarea><br>
    <button id="addCommentBtn">Add comment</button>
    <p id="commentMessage"></p>

    <script>
        const token = localStorage.getItem("access");
        if (!token) {
            window.location.href = "/";
        }

        const parts = window.location.pathname.split("/");
        const ticketId = parts[2];

        async function loadTicket() {
            const response = await fetch("/api/tickets/" + ticketId + "/", {
                headers: { "Authorization": "Bearer " + token }
            });
            if (response.ok) {
                const ticket = await response.json();
                document.getElementById("ticketTitle").textContent =
                    "#" + ticket.id + " — " + ticket.title;
                document.getElementById("ticketDetails").textContent =
                    "Status: " + ticket.status +
                    " | Priority: " + ticket.priority +
                    " | Description: " + ticket.description;
            } else {
                document.getElementById("ticketTitle").textContent = "Could not load ticket.";
            }
        }
        loadTicket();

        const claimBtn = document.getElementById("claimBtn");
        claimBtn.addEventListener("click", async function () {
            const claimMessage = document.getElementById("claimMessage");
            const response = await fetch("/api/tickets/" + ticketId + "/claim/", {
                method: "POST",
                headers: { "Authorization": "Bearer " + token }
            });
            const data = await response.json();
            if (response.ok) {
                claimMessage.textContent = "✅ " + data.detail + " (assigned to " + data.assigned_to + ")";
                loadTicket();
            } else {
                claimMessage.textContent = "⚠️ " + data.detail;
            }
        });


                // --- Real-time comments via WebSocket ---
        // Build the WebSocket URL. ws:// for http, wss:// for https (production).
        const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const socket = new WebSocket(
            wsProtocol + "//" + window.location.host + "/ws/tickets/" + ticketId + "/"
        );

        // When a comment arrives over the WebSocket, add it to the list live
        socket.onmessage = function (event) {
            const data = JSON.parse(event.data);
            const commentList = document.getElementById("commentList");

            // If the "no comments yet" placeholder is showing, clear it first
            if (commentList.querySelector("em")) {
                commentList.innerHTML = "";
            }

            const li = document.createElement("li");
            li.textContent = data.author + ": " + data.body;
            commentList.appendChild(li);
        };

        socket.onclose = function () {
            console.log("WebSocket closed");
        };
        

                // Handle logout
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", function () {
                localStorage.removeItem("access");
                localStorage.removeItem("refresh");
                window.location.href = "/";
            });
        }

        async function loadComments() {
            const response = await fetch("/api/tickets/" + ticketId + "/comments/", {
                headers: { "Authorization": "Bearer " + token }
            });
            const commentList = document.getElementById("commentList");
            commentList.innerHTML = "";
            if (response.ok) {
                const comments = await response.json();
                if (comments.length === 0) {
                    commentList.innerHTML = "<li><em>No comments yet.</em></li>";
                } else {
                    comments.forEach(function (comment) {
                        const li = document.createElement("li");
                        li.textContent = comment.author + ": " + comment.body;
                        commentList.appendChild(li);
                    });
                }
            }
        }
        loadComments();

        const addCommentBtn = document.getElementById("addCommentBtn");
        addCommentBtn.addEventListener("click", async function () {
            const body = document.getElementById("commentBody").value;
            const commentMessage = document.getElementById("commentMessage");
            const response = await fetch("/api/tickets/" + ticketId + "/comments/", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ body: body })
            });
            if (response.ok) {
                document.getElementById("commentBody").value = "";
                commentMessage.textContent = "Comment added.";
                loadComments();
            } else {
                const data = await response.json();
                commentMessage.textContent = "Failed: " + JSON.stringify(data);
            }
        });
    </script>
</body>
</html>

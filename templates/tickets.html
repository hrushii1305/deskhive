{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DeskHive — Tickets</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>My Tickets</h1>
    <button id="logoutBtn">Log out</button>
    <a href="/tickets/new/">+ New Ticket</a>
    <a href="/approvals/" id="approvalsLink" style="display:none;">Pending Approvals</a>
    <p id="message"></p>
    <ul id="ticketList"></ul>

    <script>
        // Read the token we stored at login
        const token = localStorage.getItem("access");

        // If there's no token, the user isn't logged in — send them back to login
        if (!token) {
            window.location.href = "/";
        }

        // Fetch the tickets, attaching the token to prove we're authenticated
        async function loadTickets() {
            const response = await fetch("/api/tickets/", {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            const message = document.getElementById("message");
            const ticketList = document.getElementById("ticketList");

            if (response.ok) {
                const tickets = await response.json();
                if (tickets.length === 0) {
                    message.textContent = "No tickets yet.";
                } else {
                    tickets.forEach(function (ticket) {
                        const li = document.createElement("li");
                        li.innerHTML = '<a href="/tickets/' + ticket.id + '/">#' + ticket.id + ' — ' + ticket.title + ' [' + ticket.status + ']</a>';
                        ticketList.appendChild(li);
                    });
                }
            } else {
                message.textContent = "Could not load tickets (are you logged in?).";
            }
        }
        loadTickets();

        // Show the Approvals link only for owners (role-aware UI)
        async function checkRole() {
            const response = await fetch("/api/me/", {
                headers: { "Authorization": "Bearer " + token }
            });
            if (response.ok) {
                const me = await response.json();
                if (me.role === "owner") {
                    document.getElementById("approvalsLink").style.display = "inline";
                }
            }
        }
        checkRole();

        // Handle logout
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", function () {
                localStorage.removeItem("access");
                localStorage.removeItem("refresh");
                window.location.href = "/";
            });
        }
    </script>
</body>
</html>
